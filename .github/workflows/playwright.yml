name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

# The dependency audit lives in its own workflow (`.github/workflows/audit.yml`)
# so that a newly-published advisory reports as its own check rather than turning
# this suite red for a reason unrelated to any test.
jobs:
  # Measures whether healing repairs a selector to the *correct* element, not
  # merely to one that resolves. Gated to the nightly schedule and manual runs
  # for two reasons: it spends live AI quota on every case, and a regression is
  # a property of the model/prompt rather than of any one PR's diff — so gating
  # PRs on it would turn unrelated branches red when a provider has a bad day.
  #
  # Runs in a single browser: it measures selector accuracy, not browser
  # behaviour, so the nine-project matrix would multiply cost for identical results.
  healing-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TEST_ENV: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run healing accuracy benchmark
        run: npm run test:healing-benchmark

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: healing-benchmark-report
          path: playwright-report/
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  e2e-tests:
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    needs: unit-tests
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TEST_ENV: prod

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium Browsers
            runs-on: ubuntu-24.04
            projectFlags: --project=chromium --project=chrome --project=edge --project=mobile-chrome
            browsers: chromium chrome msedge
            browser-engine: chromium
          - name: Firefox
            runs-on: ubuntu-24.04
            projectFlags: --project=firefox
            browsers: firefox
            browser-engine: firefox
          - name: WebKit Browsers
            runs-on: macos-latest
            projectFlags: --project=webkit --project=mobile-safari --project=tablet
            browsers: webkit
            browser-engine: webkit

    name: E2E — ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser-engine }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ matrix.browser-engine }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browsers }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser-engine }}

      - name: Run Playwright tests
        run: npx playwright test ${{ matrix.projectFlags }}

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright-report/
          retention-days: 7
